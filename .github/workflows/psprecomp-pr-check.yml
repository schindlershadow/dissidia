name: Build check (pull requests)

# The release workflow (psprecomp-release.yml) is the only other place the Windows build runs, and it only runs on a version tag, so a Windows-only
# compile error (v0.1.12, v0.1.15) used to show up as a failed release. This builds the runtime core and the setup wizard for both release
# platforms on every pull request into main, with the same toolchain bundle and the same script, and stops before anything is assembled or signed.

on:
  push:
    branches: [main]   # keeps the toolchain bundle cache warm on main, where pull requests and release tags can read it
    paths:
      - 'psprecomp/toolchain/**'
  pull_request:
    branches: [main]
    paths:
      - 'psprecomp/runtime/**'
      - 'psprecomp/games/**'
      - 'psprecomp/setup/**'
      - 'psprecomp/release/**'
      - 'psprecomp/toolchain/**'
      - 'psprecomp/crates/**'
      - 'psprecomp/Cargo.*'
      - '.github/workflows/psprecomp-pr-check.yml'
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: psprecomp

jobs:
  core-and-wizard:
    name: ${{ matrix.platform }} core + wizard
    # The maintainer's self-hosted runner (faster, keeps the toolchain bundle); pull requests from forks always use GitHub's runners.
    # vars.CI_BUILD_RUNNER = '"ubuntu-22.04"' sends everything back to GitHub's runners (e.g. while that machine is off).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-22.04' || fromJSON(vars.CI_BUILD_RUNNER || '["dissidia-build"]') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x86_64, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - name: Build dependencies of the bundle (same as the release job)
        if: runner.environment == 'github-hosted'   # the self-hosted runner has them installed
        run: |
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          ok=
          for i in 1 2 3; do $APT update && ok=1 && break; sleep 15; done
          [ -n "$ok" ]
          ok=
          for i in 1 2 3; do
            $APT install -y --no-install-recommends perl make python3 \
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxkbcommon-dev \
              libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
              libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libgl-dev libegl-dev && ok=1 && break
            sleep 20
          done
          [ -n "$ok" ]
      # The same cache key and folders as the release workflow: whichever run builds the bundle first saves it for the others.
      - name: Toolchain bundle cache
        id: bundle
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            psprecomp/work/bundle-${{ matrix.platform }}
            psprecomp/work/bundle-${{ matrix.platform }}.host
            psprecomp/work/cache
          key: bundle-${{ matrix.platform }}-${{ hashFiles('psprecomp/toolchain/**') }}
      - name: Toolchain bundle (kept on the self-hosted runner)
        id: localbundle
        if: runner.environment == 'self-hosted'
        run: python3 release/ci_bundle.py restore --platform ${{ matrix.platform }} --key ${{ hashFiles('psprecomp/toolchain/**') }} --work work
      # The ISO patch importer's tests (Python, standard library only): among them, that the shipped retail disc table is not a test
      # disc (issue #124: every real patch failed to install).
      - name: ISO patch (xdelta) tool tests
        if: matrix.platform == 'linux-x86_64'
        run: python3 games/dissidia/tools/test_xdelta_mod.py
      - name: Core and wizard for ${{ matrix.platform }}
        run: |
          BUNDLE=""
          if [ "${{ steps.bundle.outputs.cache-hit }}" = "true" ] || [ "${{ steps.localbundle.outputs.hit }}" = "true" ]; then BUNDLE="--bundle work/bundle-${{ matrix.platform }}"; fi
          python3 release/build_release.py --platform ${{ matrix.platform }} --version 0.0.0-pr --work work --check-only $BUNDLE
      - name: Keep the toolchain bundle
        if: runner.environment == 'self-hosted' && steps.localbundle.outputs.hit != 'true'
        run: python3 release/ci_bundle.py save --platform ${{ matrix.platform }} --key ${{ hashFiles('psprecomp/toolchain/**') }} --work work
