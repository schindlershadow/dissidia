name: Release (Dissidia Recomp)

# Builds the installable releases of this fork (design: docs/installer.md) and publishes them as a GitHub Release:
#   DissidiaRecomp-<version>-linux-x86_64.tar.xz, DissidiaRecomp-<version>-windows-x86_64.zip, the DissidiaRecomp-Setup-* single files, manifest.json
# Each archive holds the setup wizard, the recompiler, the portable compiler bundle, the prebuilt runtime core (SDK) and the
# game's tools. No game data or game-derived code is in a release: the player's machine builds the game from their own disc.
#
# Trigger: push a tag vX.Y.Z (publishes a release) or run it by hand (builds and uploads workflow artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for a manual build (no release is published)'
        default: '0.0.0-dev'

defaults:
  run:
    working-directory: psprecomp

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  recompiler-windows:
    # the Rust recompiler for the Windows release is built natively (the rest is cross-built from Linux with the zig bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the C runtime is linked into the exe (crt-static): a dynamic MSVC build needs VCRUNTIME140.dll, i.e. the Microsoft Visual C++
      # Redistributable, which many PCs do not have, and the install then failed at the recompile step
      - run: cargo build --release -p psp-cli
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: The recompiler needs no Visual C++ Redistributable
        shell: pwsh
        run: |
          $hit = Select-String -Path target/release/psprecomp.exe -Pattern 'VCRUNTIME', 'MSVCP1', 'api-ms-win-crt' -SimpleMatch -List
          if ($hit) { Write-Error "psprecomp.exe still imports the Visual C++ runtime: $($hit.Pattern)"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: recompiler-windows
          path: psprecomp/target/release/psprecomp.exe

  build-linux:
    runs-on: ${{ fromJSON(vars.CI_BUILD_RUNNER || '["dissidia-build"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - name: Build dependencies of the bundle (SDL2 loads these libraries at run time; only their headers are needed here)
        if: runner.environment == 'github-hosted'   # the self-hosted runner has them installed
        run: |
          # The runner image points apt at azure.archive.ubuntu.com. On 2026-11-11 that name did not resolve for hours (v0.1.8 failed twice
          # here), so use the main archive and retry with short timeouts instead of hanging for 20 minutes.
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          ok=
          for i in 1 2 3; do $APT update && ok=1 && break; sleep 15; done
          [ -n "$ok" ]
          ok=
          for i in 1 2 3; do
            $APT install -y --no-install-recommends perl make python3 \
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxkbcommon-dev \
              libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
              libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libgl-dev libegl-dev && ok=1 && break
            sleep 20
          done
          [ -n "$ok" ]
      # The toolchain bundle (zig plus the libraries compiled from source with it) is the same for every release until toolchain/ changes:
      # build it once, keep it in the cache, and hand it to build_release.py with --bundle on every later run.
      - name: Toolchain bundle cache
        id: bundle
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            psprecomp/work/bundle-linux-x86_64
            psprecomp/work/cache
          key: bundle-linux-x86_64-${{ hashFiles('psprecomp/toolchain/**') }}
      - name: Toolchain bundle (kept on the self-hosted runner)
        id: localbundle
        if: runner.environment == 'self-hosted'
        run: python3 release/ci_bundle.py restore --platform linux-x86_64 --key ${{ hashFiles('psprecomp/toolchain/**') }} --work work
      - name: linux-x86_64 release
        run: |
          BUNDLE=""
          if [ "${{ steps.bundle.outputs.cache-hit }}" = "true" ] || [ "${{ steps.localbundle.outputs.hit }}" = "true" ]; then BUNDLE="--bundle work/bundle-linux-x86_64"; fi
          python3 release/build_release.py --platform linux-x86_64 --version "${VERSION#v}" --work work $BUNDLE
      - name: Keep the toolchain bundle
        if: runner.environment == 'self-hosted' && steps.localbundle.outputs.hit != 'true'
        run: python3 release/ci_bundle.py save --platform linux-x86_64 --key ${{ hashFiles('psprecomp/toolchain/**') }} --work work
      - name: Collect
        run: |
          mkdir dist
          cp work/DissidiaRecomp-*.tar.xz* dist/
          cp work/DissidiaRecomp-Setup-*-linux-x86_64 dist/
          # the Linux single file must unpack itself and hold a working release
          work/DissidiaRecomp-Setup-*-linux-x86_64 --unpack "$RUNNER_TEMP/unpacked"
          test -x "$RUNNER_TEMP/unpacked/DissidiaRecomp" && test -f "$RUNNER_TEMP/unpacked/toolchain/toolchain.cmake"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-linux
          path: psprecomp/dist/*

  install-test:
    # Installs the just-built Linux release from a real Dissidia 012 ISO and plays a Quick Battle, as a desktop install and as an
    # Android-style install (Python only through a loader): release/test_install.py. Needs the game files, so it runs on the
    # maintainer's self-hosted runner (label dissidia-install; ISO paths in the runner's .env). Fork PRs never reach this runner:
    # only this workflow (tag pushes and manual runs) uses the label, and outside contributors' workflows need approval.
    needs: [build-linux]
    runs-on: [dissidia-install]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files-linux
          path: psprecomp/dist
      - name: Install and play
        run: python3 release/test_install.py --setup dist/DissidiaRecomp-Setup-*-linux-x86_64
      - name: Notify on failure
        if: failure()
        working-directory: .
        run: |
          CFG="$HOME/.config/gotify/cli.json"
          [ -f "$CFG" ] || exit 0
          curl -s -o /dev/null -X POST "$(jq -r .url "$CFG")/message" -H "X-Gotify-Key: $(jq -r .token "$CFG")" \
            -F "title=Dissidia $VERSION install test FAILED" -F "message=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" -F "priority=8"

  build-windows:
    runs-on: ${{ fromJSON(vars.CI_BUILD_RUNNER || '["dissidia-build"]') }}
    needs: recompiler-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
      - name: Build dependencies of the bundle (SDL2 loads these libraries at run time; only their headers are needed here)
        if: runner.environment == 'github-hosted'   # the self-hosted runner has them installed
        run: |
          # The runner image points apt at azure.archive.ubuntu.com. On 2026-11-11 that name did not resolve for hours (v0.1.8 failed twice
          # here), so use the main archive and retry with short timeouts instead of hanging for 20 minutes.
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          ok=
          for i in 1 2 3; do $APT update && ok=1 && break; sleep 15; done
          [ -n "$ok" ]
          ok=
          for i in 1 2 3; do
            $APT install -y --no-install-recommends perl make python3 \
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxkbcommon-dev \
              libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
              libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libgl-dev libegl-dev && ok=1 && break
            sleep 20
          done
          [ -n "$ok" ]
      - uses: actions/download-artifact@v4
        with:
          name: recompiler-windows
          path: psprecomp/recompiler-windows
      # The toolchain bundle (zig plus the libraries compiled from source with it) is the same for every release until toolchain/ changes:
      # build it once, keep it in the cache, and hand it to build_release.py with --bundle on every later run.
      - name: Toolchain bundle cache
        id: bundle
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            psprecomp/work/bundle-windows-x86_64
            psprecomp/work/bundle-windows-x86_64.host
            psprecomp/work/cache
          key: bundle-windows-x86_64-${{ hashFiles('psprecomp/toolchain/**') }}
      - name: Toolchain bundle (kept on the self-hosted runner)
        id: localbundle
        if: runner.environment == 'self-hosted'
        run: python3 release/ci_bundle.py restore --platform windows-x86_64 --key ${{ hashFiles('psprecomp/toolchain/**') }} --work work
      - name: windows-x86_64 release
        run: |
          BUNDLE=""
          if [ "${{ steps.bundle.outputs.cache-hit }}" = "true" ] || [ "${{ steps.localbundle.outputs.hit }}" = "true" ]; then BUNDLE="--bundle work/bundle-windows-x86_64"; fi
          python3 release/build_release.py --platform windows-x86_64 --version "${VERSION#v}" --work work --recompiler recompiler-windows/psprecomp.exe $BUNDLE
      - name: Keep the toolchain bundle
        if: runner.environment == 'self-hosted' && steps.localbundle.outputs.hit != 'true'
        run: python3 release/ci_bundle.py save --platform windows-x86_64 --key ${{ hashFiles('psprecomp/toolchain/**') }} --work work
      - name: Collect
        run: |
          mkdir dist
          cp work/DissidiaRecomp-*.zip* dist/
          cp work/DissidiaRecomp-Setup-*-windows-x86_64.exe dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-windows
          path: psprecomp/dist/*

  android-app:
    # The Android setup app (DissidiaRecomp-Setup-<version>-android.apk): an Android app (native views + the C++ install engine over JNI) that builds the game ON the phone from the player's own disc.
    # It carries its own compiler (zig), recompiler, Python and the prebuilt Android core, so nothing but the APK is downloaded.
    # Design and the verified steps: docs/android.md "Building on the phone".
    runs-on: ${{ fromJSON(vars.CI_BUILD_RUNNER || '["dissidia-build"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
        with:
          targets: aarch64-unknown-linux-musl
      - name: Tools and the Android SDK pieces
        if: runner.environment == 'github-hosted'   # the self-hosted runner has them (ANDROID_HOME in its .env)
        run: |
          set -e
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ninja-build cmake perl make python3 python3-pip
          pip install patchelf
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;34.0.0" "platforms;android-34"
      - name: Build the setup app
        run: python3 release/build_android_app.py --sdk "$ANDROID_HOME" --work work-android --version "${VERSION#v}" -o "work-android/DissidiaRecomp-Setup-${VERSION#v}-android.apk"
      - name: Collect
        run: |
          mkdir dist
          cp work-android/DissidiaRecomp-Setup-*-android.apk* dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: psprecomp/dist/*

  manifest:
    # manifest.json (what the updaters download first) lists every platform's asset, so it is made once all of them exist, then signed.
    needs: [build-linux, build-windows, android-app]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files-linux
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-files-windows
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: psprecomp/dist
      - name: Manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p manifest-out
          python3 release/make_manifest.py --version "${VERSION#v}" --repo "${{ github.repository }}" --tag "$VERSION" \
            --assets dist -o manifest-out/manifest.json
          # Signed manifest (docs/installer.md "Signed manifests"). A committed public key without the secret would ship
          # releases that no install accepts, so that combination fails here.
          if [ -f games/dissidia/update_key.pub ] && [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "games/dissidia/update_key.pub is committed but the RELEASE_SIGNING_KEY secret is not set"; exit 1
          fi
          if [ -n "$RELEASE_SIGNING_KEY" ]; then python3 release/sign_manifest.py sign manifest-out/manifest.json; fi
          ls -la manifest-out
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: psprecomp/manifest-out/*

  publish:
    if: github.event_name == 'push'
    needs: [build-linux, build-windows, android-app, manifest, install-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-files-linux
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-files-windows
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: psprecomp/dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release/make_notes.py --tag "$VERSION" -o notes.md
          # The .sha256 / .fp files are build-time leftovers (manifest.json carries the signed hashes and fingerprints): not published, so the
          # asset list stays short.
          # Stable-named copies of the setup files, so .../releases/latest/download/DissidiaRecomp-Setup-<platform> (the README's links)
          # always reaches the newest one. The versioned files stay: manifest.json points at them.
          for f in dist/DissidiaRecomp-Setup-*; do
            case "$f" in *.sha256|*.fp) continue ;; esac
            cp "$f" "dist/$(basename "$f" | sed -E 's/^DissidiaRecomp-Setup-[0-9][0-9.]*-/DissidiaRecomp-Setup-/')"
          done
          find dist -type f ! -name '*.sha256' ! -name '*.fp' -print0 | xargs -0 gh release create "$VERSION" --repo "${{ github.repository }}" --title "$VERSION" --notes-file notes.md
