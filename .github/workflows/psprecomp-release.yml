name: Release (Dissidia Recomp)

# Builds the installable releases of this fork (design: docs/installer.md) and publishes them as a GitHub Release:
#   DissidiaRecomp-<version>-linux-x86_64.tar.xz, DissidiaRecomp-<version>-windows-x86_64.zip, the DissidiaRecomp-Setup-* single files, manifest.json
# Each archive holds the setup wizard, the recompiler, the portable compiler bundle, the prebuilt runtime core (SDK) and the
# game's tools. No game data or game-derived code is in a release: the player's machine builds the game from their own disc.
#
# Trigger: push a tag vX.Y.Z (publishes a release) or run it by hand (builds and uploads workflow artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for a manual build (no release is published)'
        default: '0.0.0-dev'

defaults:
  run:
    working-directory: psprecomp

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  recompiler-windows:
    # the Rust recompiler for the Windows release is built natively (the rest is cross-built from Linux with the zig bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p psp-cli
      - uses: actions/upload-artifact@v4
        with:
          name: recompiler-windows
          path: psprecomp/target/release/psprecomp.exe

  build:
    runs-on: ubuntu-22.04
    needs: recompiler-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies of the bundle (SDL2 loads these libraries at run time; only their headers are needed here)
        run: |
          # The runner image points apt at azure.archive.ubuntu.com. On 2026-11-11 that name did not resolve for hours (v0.1.8 failed twice
          # here), so use the main archive and retry with short timeouts instead of hanging for 20 minutes.
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          ok=
          for i in 1 2 3; do $APT update && ok=1 && break; sleep 15; done
          [ -n "$ok" ]
          ok=
          for i in 1 2 3; do
            $APT install -y --no-install-recommends perl make python3 \
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxkbcommon-dev \
              libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
              libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libgl-dev libegl-dev && ok=1 && break
            sleep 20
          done
          [ -n "$ok" ]
      - uses: actions/download-artifact@v4
        with:
          name: recompiler-windows
          path: psprecomp/recompiler-windows
      - name: Linux release
        run: python3 release/build_release.py --platform linux-x86_64 --version "${VERSION#v}" --work work
      - name: Windows release (cross-built with the same zig)
        run: >
          python3 release/build_release.py --platform windows-x86_64 --version "${VERSION#v}" --work work
          --recompiler recompiler-windows/psprecomp.exe
      - name: Collect
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir dist
          cp work/DissidiaRecomp-*.tar.xz* work/DissidiaRecomp-*.zip* dist/
          cp work/DissidiaRecomp-Setup-*-linux-x86_64 work/DissidiaRecomp-Setup-*-windows-x86_64.exe dist/
          # the Linux single file must unpack itself and hold a working release
          work/DissidiaRecomp-Setup-*-linux-x86_64 --unpack "$RUNNER_TEMP/unpacked"
          test -x "$RUNNER_TEMP/unpacked/DissidiaRecomp" && test -f "$RUNNER_TEMP/unpacked/toolchain/toolchain.cmake" 
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: psprecomp/dist/*

  android-app:
    # The Android setup app (DissidiaRecomp-Setup-<version>-android.apk): a wizard that builds the game ON the phone from the player's own disc.
    # It carries its own compiler (zig), recompiler, Python and the prebuilt Android core, so nothing but the APK is downloaded.
    # Design and the verified steps: docs/android.md "Building on the phone".
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Tools and the Android SDK pieces
        run: |
          set -e
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ninja-build cmake perl make python3 python3-pip
          pip install patchelf
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;34.0.0" "platforms;android-34"
      - name: Build the setup app
        run: python3 release/build_android_app.py --sdk "$ANDROID_HOME" --work work-android --version "${VERSION#v}" -o "work-android/DissidiaRecomp-Setup-${VERSION#v}-android.apk"
      - name: Collect
        run: |
          mkdir dist
          cp work-android/DissidiaRecomp-Setup-*-android.apk* dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: psprecomp/dist/*

  manifest:
    # manifest.json (what the updaters download first) lists every platform's asset, so it is made once all of them exist, then signed.
    needs: [build, android-app]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: psprecomp/dist
      - name: Manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p manifest-out
          python3 release/make_manifest.py --version "${VERSION#v}" --repo "${{ github.repository }}" --tag "$VERSION" \
            --assets dist -o manifest-out/manifest.json
          # Signed manifest (docs/installer.md "Signed manifests"). A committed public key without the secret would ship
          # releases that no install accepts, so that combination fails here.
          if [ -f games/dissidia/update_key.pub ] && [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "games/dissidia/update_key.pub is committed but the RELEASE_SIGNING_KEY secret is not set"; exit 1
          fi
          if [ -n "$RELEASE_SIGNING_KEY" ]; then python3 release/sign_manifest.py sign manifest-out/manifest.json; fi
          ls -la manifest-out
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: psprecomp/manifest-out/*

  publish:
    if: github.event_name == 'push'
    needs: [build, android-app, manifest]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: psprecomp/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: psprecomp/dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release/make_notes.py --tag "$VERSION" -o notes.md
          gh release create "$VERSION" dist/* --repo "${{ github.repository }}" --title "$VERSION" --notes-file notes.md
